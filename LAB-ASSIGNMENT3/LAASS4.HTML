<!DOCTYPE html>
<html>
<head>
    <title>Rectangle Area Calculator</title>
</head>
<body>

<h2>Area of Rectangle</h2>

Length: <input type="text" id="lengthValue"><br><br>
Width: <input type="text" id="widthValue"><br><br>

<button onclick="calculateArea()">Calculate</button>

<p id="output"></p>

<script>
function calculateArea() {
    var lengthValue = document.getElementById("lengthValue").value;
    var widthValue = document.getElementById("widthValue").value;
    var areaResult = lengthValue * widthValue;

    lengthValue = parseFloat(lengthValue);
    widthValue = parseFloat(widthValue);
    var floatAreaResult = lengthValue * widthValue;

    document.getElementById("output").innerHTML =
        "Integer Area: " + areaResult + "<br>" +
        "Floating Point Area: " + floatAreaResult;
}
</script>

</html>
