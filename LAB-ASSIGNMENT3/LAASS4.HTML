<!DOCTYPE html>
<html>
<head>
    <title>Rectangle Area Calculator</title>
</head>
<body>

<h2>Area of Rectangle</h2>

<p id="output"></p>

<script>
    var lengthValue = 10;
    var widthValue = 5;
    var areaResult = lengthValue * widthValue;

    lengthValue = 10.5;
    widthValue = 5.2;
    var floatAreaResult = lengthValue * widthValue;

    document.getElementById("output").innerHTML =
        "Integer Area: " + areaResult + "<br>" +
        "Floating Point Area: " + floatAreaResult;
</script>

</body>
</html>
