<!DOCTYPE html>
<html>
<head>
    <title>Hello World Button</title>
</head>
<body>

    <h2 id="text">Click the button to see message</h2>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            var element = document.getElementById("text");
            element.outerHTML = "<h2 id='text'>Hello, world!</h2>";
        }
    </script>

</body>
</html>
